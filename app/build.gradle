plugins { id 'com.android.application' }

android {
    namespace 'de.flo.kabelfernsehen'
    compileSdk 34

    defaultConfig {
        applicationId 'de.flo.kabelfernsehen'
        minSdk 22
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
}
