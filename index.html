<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kabelfernsehen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  body.idle { cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* Senderanzeige oben rechts, wie am Röhrenfernseher */
  #num {
    position: fixed; top: 4vh; right: 5vw;
    font: 700 9vh/1 Consolas, "Courier New", monospace;
    color: #3dff5a; text-shadow: 0 0 .6vh #0a0, .3vh .3vh 0 #000;
    opacity: 0; transition: opacity .4s;
  }
  /* Infobalken unten */
  #bar {
    position: fixed; left: 5vw; right: 5vw; bottom: 6vh;
    display: flex; align-items: baseline; gap: 2vw;
    padding: 2vh 2.5vw; border-radius: 1vh;
    background: rgba(10, 14, 24, .82);
    opacity: 0; transition: opacity .4s;
  }
  #bar .n { font: 700 5vh/1 Consolas, monospace; color: #3dff5a; }
  #bar .name { font-size: 4.2vh; font-weight: 600; flex: 1; }
  #bar .state { font-size: 2.4vh; color: #ffb84d; }
  #bar .clock { font: 3.4vh/1 Consolas, monospace; color: #cfd6e4; }
  .show { opacity: 1 !important; }

  /* Senderliste */
  #list {
    position: fixed; top: 0; bottom: 0; left: 0; width: min(32vw, 460px);
    background: rgba(10, 14, 24, .93); overflow-y: auto;
    transform: translateX(-100%); transition: transform .2s;
    padding: 2vh 0; box-sizing: border-box; scrollbar-width: none; touch-action: pan-y;
  }
  #list.open { transform: none; }
  #list div { padding: 1.3vh 1.6vw; font-size: 2.6vh; display: flex; gap: 1.2vw; cursor: pointer; }
  #list div b { font-family: Consolas, monospace; color: #3dff5a; width: 2.2em; text-align: right; }
  #list div.sel { background: #2a5bd7; }
  #list div.on::after { content: "●"; color: #3dff5a; margin-left: auto; }

  #hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    padding: 3vh 4vw; border-radius: 1.5vh; background: rgba(10, 14, 24, .9);
    font-size: 3.4vh; text-align: center; display: none; cursor: pointer;
  }
  #help {
    position: fixed; right: 5vw; top: 16vh; padding: 2vh 2vw; border-radius: 1vh;
    background: rgba(10, 14, 24, .9); font-size: 2.2vh; line-height: 1.7; display: none;
  }
  #diag {
    position: fixed; left: 3vw; top: 3vh; width: 70vw; padding: 1.5vh 1.5vw; border-radius: 1vh;
    background: rgba(10, 14, 24, .92); font: 2vh/1.5 Consolas, monospace; color: #ffb84d;
    word-break: break-all; display: none;
  }
  #help kbd { font-family: Consolas, monospace; color: #3dff5a; }
</style>
</head>
<body>
<video id="v" playsinline></video>
<div id="num"></div>
<div id="bar"><span class="n"></span><span class="name"></span><span class="state"></span><span class="clock"></span></div>
<div id="list"></div>
<div id="hint">Taste drücken oder klicken<br>für Ton</div>
<div id="help">
  <kbd>↑ ↓</kbd> / Mausrad / Wischen: Sender wechseln<br>
  <kbd>0–9</kbd> Sender direkt wählen<br>
  <kbd>Enter</kbd> Senderliste<br>
  <kbd>← →</kbd> Lautstärke · <kbd>M</kbd> stumm<br>
  <kbd>Rücktaste</kbd> letzter Sender<br>
  <kbd>F</kbd> / Doppelklick: Vollbild<br>
  <kbd>I</kbd> Info · <kbd>H</kbd> / Menü-Taste: diese Hilfe · v3
  <div id="lastkey"></div>
</div>
<div id="diag"></div>

<script src="hls.min.js"></script>
<script>
// ───────────── Senderliste: hier Reihenfolge ändern, Sender ergänzen oder streichen ─────────────
const SENDER = [
  ["Das Erste",          "https://daserste-live.ard-mcdn.de/daserste/live/hls/de/master.m3u8"],
  ["ZDF",                "https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8"],
  ["BR Fernsehen",       "https://mcdn.br.de/br/fs/bfs_sued/hls/de/master.m3u8"],
  ["KiKA",               "https://kikageohls.akamaized.net/hls/live/2022693/livetvkika_de/master.m3u8"],
  ["3sat",               "https://zdf-hls-18.akamaized.net/hls/live/2016501/dach/veryhigh/master.m3u8"],
  ["arte",               "https://artesimulcast.akamaized.net/hls/live/2030993/artelive_de/master.m3u8"],
  ["ZDFneo",             "https://zdf-hls-16.akamaized.net/hls/live/2016499/de/veryhigh/master.m3u8"],
  ["ONE",                "https://mcdn-one.ard.de/ardone/hls/master.m3u8"],
  ["ZDFinfo",            "https://zdf-hls-17.akamaized.net/hls/live/2016500/de/veryhigh/master.m3u8"],
  ["phoenix",            "https://zdf-hls-19.akamaized.net/hls/live/2016502/de/veryhigh/master.m3u8"],
  ["tagesschau24",       "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8"],
  ["ARD alpha",          "https://mcdn.br.de/br/fs/ard_alpha/hls/de/master.m3u8"],
  ["WDR",                "https://wdr-live.ard-mcdn.de/wdr/live/hls/de/master.m3u8"],
  ["NDR",                "https://mcdn.ndr.de/ndr/hls/ndr_fs/ndr_nds/master.m3u8"],
  ["SWR",                "https://swrbwd-hls.akamaized.net/hls/live/2018672/swrbwd/master.m3u8"],
  ["hr-fernsehen",       "https://hrhlsde.akamaized.net/hls/live/2024526/hrhlsde/master.m3u8"],
  ["MDR",                "https://mdrtvsnhls.akamaized.net/hls/live/2016928/mdrtvsn/master.m3u8"],
  ["rbb",                "https://rbb-hls-berlin.akamaized.net/hls/live/2017824/rbb_berlin/master.m3u8"],
  ["SR Fernsehen",       "https://srfs.akamaized.net/hls/live/689649/srfsgeo/index.m3u8"],
  ["Radio Bremen",       "https://rbhlslive.akamaized.net/hls/live/2020435/rbfs/master.m3u8"],
];
// ────────────────────────────────────────────────────────────────────────────────────────────────

const $ = id => document.getElementById(id);
const v = $("v"), num = $("num"), bar = $("bar"), list = $("list"), hint = $("hint"), help = $("help");

// Merker (letzter Sender, Lautstärke) – fällt ohne Speicher still auf Standard zurück
const mem = {
  get(k, d) { try { const x = localStorage.getItem("tv." + k); return x === null ? d : JSON.parse(x); } catch (e) { return d; } },
  set(k, x) { try { localStorage.setItem("tv." + k, JSON.stringify(x)); } catch (e) {} },
};

const VERSION = "3";
let cur = -1, prev = -1, hls = null, sel = 0, digits = "", digitTimer, osdTimer, idleTimer, retryTimer;

// Wiedergabearten: "js" = Abspielbibliothek im Browser, "nativ" = eingebauter Player des Geräts.
// Klappt eine Art nicht, wird von selbst die andere versucht; die funktionierende wird gemerkt.
const MODES = [];
if (window.Hls && Hls.isSupported()) MODES.push("js");
MODES.push("nativ");
const storedMode = () => { const m = mem.get("mode", MODES[0]); return MODES.indexOf(m) >= 0 ? m : MODES[0]; };
let mode = storedMode(), savedMode = mem.get("mode", ""), tried = [], lastErr = "", gen = 0, watchdog;

function setState(t) { bar.querySelector(".state").textContent = t; }

function osd(ms = 3500) {
  bar.querySelector(".n").textContent = cur + 1;
  bar.querySelector(".name").textContent = SENDER[cur][0];
  bar.querySelector(".clock").textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  num.textContent = cur + 1;
  num.classList.add("show"); bar.classList.add("show");
  clearTimeout(osdTimer);
  osdTimer = setTimeout(() => { num.classList.remove("show"); bar.classList.remove("show"); }, ms);
}

function play() {
  v.play().catch(() => {
    // Browser erlaubt Ton erst nach einer Eingabe: stumm starten und Hinweis zeigen
    v.muted = true; hint.style.display = "block";
    v.play().catch(() => {});
  });
}

function tune(i, force) {
  i = ((i % SENDER.length) + SENDER.length) % SENDER.length;
  if (i === cur && !force) { osd(); return; }
  if (i !== cur) { prev = cur; cur = i; }
  mem.set("sender", cur);
  setState("");
  osd();
  markList();
  tried = []; lastErr = "";
  $("diag").style.display = "none";
  start();
}

function stop() {
  gen++;
  clearTimeout(retryTimer); clearTimeout(watchdog);
  if (hls) { hls.destroy(); hls = null; }
  while (v.firstChild) v.removeChild(v.firstChild);
  v.removeAttribute("src");
}

function start() {
  stop();
  const url = SENDER[cur][1], my = gen;
  watchdog = setTimeout(() => { if (my === gen) fail("kein Bild nach 12 s"); }, 12000);
  if (mode === "js") {
    let recovered = false;
    hls = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 20 });
    const mine = hls;
    hls.on(Hls.Events.MANIFEST_PARSED, play);
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal || my !== gen) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR && !recovered) { recovered = true; mine.recoverMediaError(); return; }
      fail(d.type + "/" + d.details);
    });
    hls.loadSource(url);
    hls.attachMedia(v);
  } else {
    const s = document.createElement("source");
    s.src = url; s.type = "application/vnd.apple.mpegurl";
    s.onerror = () => { if (my === gen) fail("Quelle abgelehnt"); };
    v.onerror = () => { if (my === gen) fail("Videofehler " + (v.error ? v.error.code : "?")); };
    v.appendChild(s);
    v.load();
    play();
  }
}

// Wiedergabe kam nicht zustande: andere Art versuchen, sonst Diagnose zeigen und später neu versuchen
function fail(msg) {
  lastErr = mode + ": " + msg + (lastErr ? " | " + lastErr : "");
  tried.push(mode);
  const next = MODES.filter(m => tried.indexOf(m) < 0)[0];
  if (next) { mode = next; start(); return; }
  const text = diag();
  stop();
  setState("Kein Bild"); osd(8000);
  $("diag").textContent = text; $("diag").style.display = "block";
  mode = storedMode();
  retryTimer = setTimeout(() => tune(cur, true), 15000);
}

function diag() {
  const c = x => v.canPlayType(x) || "nein";
  return "Kabelfernsehen v" + VERSION + " · versucht: " + tried.join(", ") +
    " · hls.js " + (window.Hls ? (Hls.isSupported() ? "ja" : "nein") : "fehlt") +
    " · MSE " + (window.MediaSource ? "ja" : window.ManagedMediaSource ? "managed" : "nein") +
    " · HLS nativ " + c("application/vnd.apple.mpegurl") +
    " · DASH " + c("application/dash+xml") +
    " · H.264 " + c('video/mp4; codecs="avc1.640028"') +
    " · Bild " + v.videoWidth + "x" + v.videoHeight + " · Zustand " + v.readyState + " · Zeit " + v.currentTime.toFixed(1) +
    " · Fehler: " + (lastErr || "-") + " · " + navigator.userAgent;
}

// Läuft wirklich ein Bild? Dann Überwachung beenden und die Wiedergabeart merken
v.addEventListener("timeupdate", () => {
  if (!(v.videoWidth > 0 && v.currentTime > 0)) return;
  clearTimeout(watchdog);
  $("diag").style.display = "none";
  if (savedMode !== mode) { savedMode = mode; mem.set("mode", mode); }
});

// Senderliste
function buildList() {
  list.innerHTML = "";
  SENDER.forEach((s, i) => {
    const d = document.createElement("div");
    const b = document.createElement("b"); b.textContent = i + 1;
    d.append(b, document.createTextNode(s[0]));
    d.onclick = () => { tune(i); toggleList(false); };
    list.append(d);
  });
}
function markList() {
  [...list.children].forEach((d, i) => {
    d.classList.toggle("on", i === cur);
    d.classList.toggle("sel", i === sel);
  });
  const el = list.children[sel];
  if (el && listOpen()) el.scrollIntoView({ block: "nearest" });
}
const listOpen = () => list.classList.contains("open");
function toggleList(on = !listOpen()) {
  list.classList.toggle("open", on);
  if (on) { sel = cur; markList(); }
}

function volume(delta) {
  v.muted = false;
  v.volume = Math.min(1, Math.max(0, Math.round((v.volume + delta) * 20) / 20));
  mem.set("vol", v.volume);
  setState("Lautstärke " + Math.round(v.volume * 100) + " %"); osd(1500);
  setTimeout(() => setState(""), 1500);
}

function digit(n) {
  digits += n;
  num.textContent = digits + "–"; num.classList.add("show");
  clearTimeout(digitTimer);
  const go = () => { const k = parseInt(digits, 10); digits = ""; if (k >= 1 && k <= SENDER.length) tune(k - 1); else osd(); };
  // sofort schalten, wenn keine weitere Ziffer mehr sinnvoll ist
  if (parseInt(digits, 10) * 10 > SENDER.length) go(); else digitTimer = setTimeout(go, 1500);
}

function unmuteOnce() {
  if (hint.style.display === "block") { hint.style.display = "none"; v.muted = false; v.play().catch(() => {}); }
}
function fullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

// Eine Aktion ausführen – egal ob sie von der Tastatur oder von der TV-Fernbedienung kommt
function act(a) {
  unmuteOnce();
  if (/^[0-9]$/.test(a)) { digit(a); return true; }
  if (listOpen()) {
    if (a === "down") { sel = (sel + 1) % SENDER.length; markList(); }
    else if (a === "up") { sel = (sel - 1 + SENDER.length) % SENDER.length; markList(); }
    else if (a === "ok") { tune(sel); toggleList(false); }
    else if (a === "back" || a === "left") toggleList(false);
    else return false;
    return true;
  }
  switch (a) {
    case "up": case "next": tune(cur + 1); break;
    case "down": case "prev": tune(cur - 1); break;
    case "right": volume(+.05); break;
    case "left": volume(-.05); break;
    case "ok": toggleList(true); break;
    case "back": if (help.style.display === "block") help.style.display = "none"; else if (prev >= 0) tune(prev); break;
    case "mute": v.muted = !v.muted; setState(v.muted ? "Stumm" : ""); osd(1500); break;
    case "full": fullscreen(); break;
    case "info": osd(); break;
    case "help": help.style.display = help.style.display === "block" ? "none" : "block"; break;
    default: return false;
  }
  return true;
}
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "ok",
  Backspace: "back", Escape: "back", PageUp: "next", PageDown: "prev", "+": "next", "-": "prev",
  m: "mute", M: "mute", f: "full", F: "full", i: "info", I: "info", h: "help", H: "help" };
addEventListener("keydown", e => {
  const a = /^[0-9]$/.test(e.key) ? e.key : KEYS[e.key];
  if (a && act(a)) e.preventDefault();
});

// Schnittstelle für die Fire-TV-App
window.tvAct = act;
window.tvKey = name => { $("lastkey").textContent = "Letzte Taste: " + name; };
window.tvStop = () => { stop(); v.pause(); };
window.tvResume = () => { if (cur >= 0) tune(cur, true); };

let wheelLock = 0;
addEventListener("wheel", e => {
  if (listOpen() || Date.now() < wheelLock) return;
  wheelLock = Date.now() + 350;
  tune(cur + (e.deltaY < 0 ? 1 : -1));
}, { passive: true });
v.addEventListener("click", () => { unmuteOnce(); if (listOpen()) toggleList(false); else osd(); });
hint.addEventListener("click", unmuteOnce);
v.addEventListener("dblclick", fullscreen);
addEventListener("mousemove", e => {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add("idle"), 2500);
  if (e.clientX < 8) toggleList(true);        // Maus an den linken Rand: Senderliste
});

// Wischen am Handy: hoch/runter zappt, nach rechts öffnet die Senderliste, nach links schließt sie
let touch = null;
addEventListener("touchstart", e => {
  const t = e.touches[0];
  touch = e.touches.length === 1 && !list.contains(e.target) ? { x: t.clientX, y: t.clientY } : null;
}, { passive: true });
addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 50) return;      // nur getippt
  unmuteOnce();
  if (Math.abs(dy) > Math.abs(dx)) { if (!listOpen()) tune(cur + (dy < 0 ? 1 : -1)); }
  else toggleList(dx > 0);
}, { passive: true });

// Start: letzter Sender, letzte Lautstärke
buildList();
v.volume = mem.get("vol", 1);
tune(Math.min(mem.get("sender", 0), SENDER.length - 1));
</script>
</body>
</html>
